<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikSoda · Chat</title>
<link rel="stylesheet" href="/shared/temas.css">
<script src="/shared/tema.js"></script>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: var(--ov-font); color: var(--ov-text); font-size: var(--tam, 18px);
    height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
    padding: 10px; box-sizing: border-box;
  }
  .msg {
    display: flex; align-items: flex-start; gap: 10px; max-width: 100%; align-self: flex-start;
    background: var(--ov-bg); border: var(--ov-border-w) solid var(--ov-border); border-radius: var(--ov-radius);
    box-shadow: var(--ov-shadow); padding: 7px 12px 7px 8px; line-height: 1.3;
    text-shadow: var(--ov-text-shadow); animation: entra 240ms ease-out both; box-sizing: border-box;
  }
  .msg.sai { animation: sai 350ms ease-in forwards; }
  .avatar { width: 1.9em; height: 1.9em; border-radius: 50%; flex: none; background: #555 center/cover; display: grid; place-items: center; font-weight: 800; font-size: .9em; color: #fff; text-shadow: none; }
  .sem-avatar .avatar { display: none; }
  .corpo { min-width: 0; overflow-wrap: anywhere; padding-top: .15em; }
  .nome { font-weight: 800; margin-right: .35em; color: var(--cor-nome); }
  .msg.gift { border-left: 4px solid #ffc93c; }
  .msg.gift .texto { color: #ffd76a; font-weight: 700; }
  html[data-tema="claro"] .msg.gift .texto { color: #b07800; }
  .msg.gift img { width: 1.4em; height: 1.4em; vertical-align: middle; margin-left: .2em; }
  .badge { font-size: .75em; margin-right: .3em; }
  @keyframes entra { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes sai { to { opacity: 0; transform: translateX(-16px); } }
</style>
</head>
<body>
<script type="module">
  import { connectLive, escapeHtml, initials, formatNumber } from '/shared/live-client.js';

  // Chat da live na tela. Opções pelo link:
  //   ?max=10        quantas mensagens aparecem (padrão 10)
  //   ?tempo=30      cada mensagem some depois de 30 segundos (padrão: não some)
  //   ?tamanho=22    tamanho da letra em px (padrão 18)
  //   ?avatar=0      sem foto
  //   ?comandos=0    esconde mensagens que começam com ! (ex.: !falar, !roleta)
  //   ?presentes=1   mostra os presentes no meio do chat
  //   ?tema=neon
  const params = new URLSearchParams(location.search);
  const MAX = Math.min(50, Number(params.get('max')) || 10);
  const TEMPO = (Number(params.get('tempo')) || 0) * 1000;
  const COMANDOS = params.get('comandos') !== '0';
  const PRESENTES = params.get('presentes') === '1';
  if (params.get('tamanho')) document.body.style.setProperty('--tam', `${Math.min(60, Math.max(10, Number(params.get('tamanho')) || 18))}px`);
  if (params.get('avatar') === '0') document.body.classList.add('sem-avatar');

  // Cada pessoa ganha sempre a mesma cor no nome.
  const CORES = ['#ff7ab8', '#25f4ee', '#ffc93c', '#b4a8ff', '#6fe3a0', '#ffa36b', '#7cb8ff', '#f78bf7'];
  const corDe = (s) => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return CORES[h % CORES.length]; };
  let top1 = '';

  function add(ev) {
    if (ev.streaking) return;
    if (ev.type === 'gift' ? !PRESENTES : ev.type !== 'chat') return;
    if (ev.type === 'chat' && !COMANDOS && String(ev.comment).trim().startsWith('!')) return;
    const el = document.createElement('div');
    el.className = `msg ${ev.type}`;
    el.style.setProperty('--cor-nome', corDe(ev.user.username || ev.user.nickname));
    const avatar = ev.user.avatar
      ? `<div class="avatar" style="background-image:url('${escapeHtml(ev.user.avatar)}')"></div>`
      : `<div class="avatar">${escapeHtml(initials(ev.user.nickname))}</div>`;
    const badge = top1 && ev.user.username === top1 ? '<span class="badge" title="Top 1 em presentes">👑</span>' : '';
    const texto = ev.type === 'gift'
      ? `enviou ${ev.repeatCount > 1 ? `${ev.repeatCount}x ` : ''}${escapeHtml(ev.giftName)}${ev.giftImage ? `<img src="${escapeHtml(ev.giftImage)}" alt="">` : ' 🎁'} · ${formatNumber(ev.totalCoins)} coins`
      : escapeHtml(ev.comment);
    el.innerHTML = `${avatar}<div class="corpo">${badge}<span class="nome">${escapeHtml(ev.user.nickname)}</span><span class="texto">${texto}</span></div>`;
    document.body.appendChild(el);
    const all = document.body.querySelectorAll('.msg');
    if (all.length > MAX) all[0].remove();
    if (TEMPO) setTimeout(() => { el.classList.add('sai'); setTimeout(() => el.remove(), 350); }, TEMPO);
  }

  const setTop = (r) => { top1 = r?.coins?.[0]?.username || ''; };
  connectLive({
    onHello: ({ recent, rankings }) => { setTop(rankings); if (!TEMPO) recent.forEach(add); },
    onEvent: add,
    onRankings: setTop,
  });
</script>
</body>
</html>
