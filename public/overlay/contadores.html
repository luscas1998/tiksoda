<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikSoda · Contadores</title>
<link rel="stylesheet" href="/shared/temas.css">
<script src="/shared/tema.js"></script>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: var(--ov-font); color: var(--ov-text); padding: 10px; box-sizing: border-box; font-size: var(--tam, 22px); }
  .box { display: flex; gap: .45em; flex-wrap: wrap; }
  .coluna .box { flex-direction: column; align-items: flex-start; }
  .item {
    display: flex; align-items: center; gap: .4em; padding: .35em .7em; border-radius: var(--ov-radius);
    background: var(--ov-bg); border: var(--ov-border-w) solid var(--ov-border); box-shadow: var(--ov-shadow);
    text-shadow: var(--ov-text-shadow); font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .item .ico { font-size: 1em; }
  .item small { font-weight: 600; font-size: .62em; opacity: .85; }
  .item.pop .num { animation: pop .45s ease-out; display: inline-block; }
  .ultimo { font-weight: 700; }
  .ultimo b { color: var(--ov-accent); }
  @keyframes pop { 40% { transform: scale(1.3); } }
</style>
</head>
<body>
<div class="box" id="box"></div>
<script type="module">
  import { connectLive, escapeHtml, formatNumber } from '/shared/live-client.js';

  // Contadores da live. Opções:
  //   ?itens=likes,follows,shares,coins,viewers,gifts   o que mostrar e em que ordem
  //   ?coluna=1   um embaixo do outro · ?tamanho=28 · ?legenda=0 (sem o texto pequeno)
  //   ?ultimo=1   mostra o último seguidor e o último presente · ?tema=neon
  const params = new URLSearchParams(location.search);
  const ITENS = (params.get('itens') || 'likes,follows,shares,coins').split(',').map((s) => s.trim()).filter(Boolean);
  const LEGENDA = params.get('legenda') !== '0';
  const ULTIMO = params.get('ultimo') === '1';
  if (params.get('coluna') === '1') document.body.classList.add('coluna');
  if (params.get('tamanho')) document.body.style.setProperty('--tam', `${Math.min(80, Math.max(10, Number(params.get('tamanho')) || 22))}px`);
  const INFO = {
    likes: ['❤️', 'likes'], follows: ['💗', 'seguidores'], shares: ['🔁', 'shares'],
    coins: ['🪙', 'coins'], viewers: ['👁', 'assistindo'], gifts: ['🎁', 'presentes'],
  };
  const values = {};
  const box = document.getElementById('box');
  box.innerHTML = ITENS.filter((k) => INFO[k]).map((k) => `<div class="item" data-k="${k}"><span class="ico">${INFO[k][0]}</span><span class="num">0</span>${LEGENDA ? `<small>${INFO[k][1]}</small>` : ''}</div>`).join('')
    + (ULTIMO ? '<div class="item ultimo" id="ult-follow" hidden></div><div class="item ultimo" id="ult-gift" hidden></div>' : '');

  function set(k, v) {
    const el = box.querySelector(`[data-k="${k}"]`);
    if (!el) return;
    v = Number(v) || 0;
    if (values[k] === v) return;
    const up = values[k] !== undefined && v > values[k];
    values[k] = v;
    el.querySelector('.num').textContent = formatNumber(v);
    if (up) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  }
  const fromRankings = (r) => { const t = r?.totals || {}; for (const k of ['likes', 'follows', 'shares', 'coins', 'gifts']) set(k, t[k]); };
  const fromStatus = (s) => set('viewers', s?.state === 'conectado' ? s.viewers : 0);
  function ultimo(ev) {
    if (!ULTIMO || ev.streaking) return;
    if (ev.type === 'follow') { const el = document.getElementById('ult-follow'); el.hidden = false; el.innerHTML = `💗 Último seguidor: <b>${escapeHtml(ev.user.nickname)}</b>`; }
    if (ev.type === 'gift') { const el = document.getElementById('ult-gift'); el.hidden = false; el.innerHTML = `🎁 Último presente: <b>${escapeHtml(ev.user.nickname)}</b> · ${escapeHtml(ev.giftName)}`; }
  }

  connectLive({
    onHello: ({ rankings, status, recent }) => { fromRankings(rankings); fromStatus(status); (recent || []).forEach(ultimo); },
    onRankings: fromRankings,
    onStatus: fromStatus,
    onEvent: ultimo,
  });
</script>
</body>
</html>
