<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikSoda · Feed de eventos</title>
<link rel="stylesheet" href="/shared/temas.css">
<script src="/shared/tema.js"></script>
<style>
  /* Fundo transparente para ficar por cima da live. */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body {
    font-family: var(--ov-font);
    height: 100vh; display: flex; flex-direction: column; justify-content: flex-end;
    padding: 12px; box-sizing: border-box; gap: 8px;
  }
  .item {
    display: flex; align-items: center; gap: 10px;
    background: var(--ov-bg); color: var(--ov-text);
    border-radius: var(--ov-radius); box-shadow: var(--ov-shadow);
    border: var(--ov-border-w) solid var(--ov-border); padding: 8px 12px;
    font-size: 18px; line-height: 1.25;
    border-left: 4px solid var(--c, #8b8b9a);
    animation: entra 260ms ease-out;
    text-shadow: var(--ov-text-shadow);
  }
  .item.gift { --c: #ffc93c; }
  .item.follow { --c: #ff4f8b; }
  .item.share { --c: #3ccfff; }
  .item.chat { --c: #9a8cff; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    background: #444 center/cover; display: grid; place-items: center; font-weight: 700;
  }
  .name { font-weight: 700; margin-right: 6px; }
  .gift-img { width: 28px; height: 28px; flex: none; }
  .saindo { animation: sai 400ms ease-in forwards; }
  @keyframes entra { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }
  @keyframes sai { to { opacity: 0; transform: translateX(-20px); } }
</style>
</head>
<body>
<script type="module">
  import { connectLive, escapeHtml, initials, describe } from '/shared/live-client.js';

  // Ajustes pela URL, ex.: /overlay/eventos?max=6&tempo=20&tipos=chat,gift
  const params = new URLSearchParams(location.search);
  const MAX = Number(params.get('max')) || 8;
  const TEMPO = (Number(params.get('tempo')) || 0) * 1000; // 0 = não some
  const TIPOS = new Set((params.get('tipos') || 'chat,gift,follow,share').split(','));

  function add(ev) {
    if (!TIPOS.has(ev.type) || ev.streaking) return;
    const el = document.createElement('div');
    el.className = `item ${ev.type}`;
    const avatar = ev.user.avatar
      ? `<div class="avatar" style="background-image:url('${escapeHtml(ev.user.avatar)}')"></div>`
      : `<div class="avatar">${escapeHtml(initials(ev.user.nickname))}</div>`;
    const giftImg = ev.type === 'gift' && ev.giftImage ? `<img class="gift-img" src="${escapeHtml(ev.giftImage)}" alt="">` : '';
    el.innerHTML = `${avatar}<div><span class="name">${escapeHtml(ev.user.nickname)}</span>${escapeHtml(describe(ev))}</div>${giftImg}`;
    document.body.appendChild(el);
    while (document.body.querySelectorAll('.item').length > MAX) document.body.querySelector('.item').remove();
    if (TEMPO) setTimeout(() => { el.classList.add('saindo'); setTimeout(() => el.remove(), 400); }, TEMPO);
  }

  connectLive({
    onHello: ({ recent }) => { if (!TEMPO) recent.slice(-MAX).forEach(add); },
    onEvent: add,
  });
</script>
</body>
</html>
