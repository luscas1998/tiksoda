<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikSoda · Meta</title>
<link rel="stylesheet" href="/shared/temas.css">
<script src="/shared/tema.js"></script>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  body {
    font-family: var(--ov-font); color: var(--ov-text);
    display: grid; place-items: center; --c: #ffc93c; --pct: 0;
  }
  .meta {
    display: grid; justify-items: center; gap: 8px; text-align: center; padding: 14px 22px;
    transition: opacity 400ms, transform 400ms;
    background: var(--ov-bg-soft); border-radius: var(--ov-radius); box-shadow: var(--ov-soft-shadow);
    border: var(--ov-border-w) solid var(--ov-border); box-sizing: border-box; max-width: 96vw;
  }
  .meta.escondida { opacity: 0; transform: scale(.85); }
  .txt { font-weight: 800; font-size: 26px; line-height: 1.15; max-width: 92vw; text-shadow: var(--ov-soft-text-shadow); }
  .txt:empty { display: none; }
  .bottom { font-size: 40px; color: var(--c); }
  .pop { animation: pop 350ms ease-out; }
  .top { font-size: 17px; font-weight: 600; opacity: .95; text-shadow: var(--ov-soft-text-shadow); }
  .top:empty { display: none; }
  .icone { display: grid; place-items: center; }
  .icone img { width: 100%; height: 100%; object-fit: contain; }
  .icone .emo { line-height: 1; }
  .selo { display: none; font-weight: 900; font-size: 20px; background: var(--c); color: #1a1a1a; padding: 4px 14px; border-radius: 999px; }
  .concluida .selo { display: inline-block; }
  .modelo { display: none; }

  /* ---------- presente pulsando ---------- */
  .m-presente .modelo.presente { display: grid; justify-items: center; gap: 6px; }
  .presente .icone { width: var(--tam, 130px); height: var(--tam, 130px); animation: pulsa 1.1s ease-in-out infinite; filter: drop-shadow(0 0 14px var(--c)); }
  .presente .icone .emo { font-size: calc(var(--tam, 130px) * .72); }
  .barrinha { width: 240px; height: 12px; border-radius: 12px; background: var(--ov-track); overflow: hidden; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
  .barrinha div { height: 100%; width: calc(var(--pct) * 1%); background: linear-gradient(90deg, var(--c), #fff7c2); border-radius: 12px; transition: width 400ms ease; }
  .concluida .presente .icone { animation: none; filter: drop-shadow(0 0 22px var(--c)) saturate(1.2); }

  /* ---------- barra grande ---------- */
  .m-barra .modelo.barra { display: flex; align-items: center; width: min(560px, 90vw); }
  .barra .icone { width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--ov-bg); box-shadow: 0 0 0 3px var(--c), 0 0 16px var(--c); z-index: 1; margin-right: -18px; overflow: hidden; }
  .barra .icone img { width: 80%; height: 80%; }
  .barra .icone .emo { font-size: 34px; }
  .trilho { position: relative; flex: 1; height: 46px; border-radius: 46px; background: var(--ov-track); overflow: hidden; box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); }
  .trilho .fill { position: absolute; inset: 0 auto 0 0; width: calc(var(--pct) * 1%); background: linear-gradient(90deg, var(--c), #fff3b0); transition: width 500ms ease; }
  .trilho .fill::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 12px, transparent 12px 24px); background-size: 34px 34px; animation: listras 1s linear infinite; }
  .trilho .valor { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 22px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); padding-left: 14px; }

  /* ---------- círculo ---------- */
  .m-circulo .modelo.circulo { display: grid; place-items: center; position: relative; width: var(--tam, 200px); height: var(--tam, 200px); }
  .circulo svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .circulo circle { fill: none; stroke-width: 12; }
  .circulo .fundo { stroke: var(--ov-track); }
  .circulo .arco { stroke: var(--c); stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: calc(100 - var(--pct)); transition: stroke-dashoffset 500ms ease; filter: drop-shadow(0 0 6px var(--c)); }
  .circulo .dentro { display: grid; justify-items: center; gap: 2px; }
  .circulo .icone { width: calc(var(--tam, 200px) * .34); height: calc(var(--tam, 200px) * .34); }
  .circulo .icone .emo { font-size: calc(var(--tam, 200px) * .26); }
  .circulo .valor { font-weight: 900; font-size: calc(var(--tam, 200px) * .14); text-shadow: var(--ov-soft-text-shadow); }

  /* ---------- número grande ---------- */
  .m-numero .modelo.numero { display: flex; align-items: center; gap: 14px; }
  .numero .icone { width: 72px; height: 72px; animation: pulsa 1.4s ease-in-out infinite; }
  .numero .icone .emo { font-size: 56px; }
  .numero .valor { font-weight: 900; font-size: 84px; line-height: 1; color: var(--c); text-shadow: var(--ov-soft-text-shadow), 0 0 18px var(--c); font-variant-numeric: tabular-nums; }
  .numero .de { font-size: 24px; font-weight: 700; opacity: .85; text-shadow: var(--ov-soft-text-shadow); align-self: flex-end; margin-bottom: 10px; }

  /* ---------- copo enchendo ---------- */
  .m-copo .modelo.copo { display: grid; justify-items: center; filter: drop-shadow(0 0 2px rgba(0,0,0,.7)) drop-shadow(0 4px 10px rgba(0,0,0,.35)); }
  .copo .vidro {
    position: relative; width: 150px; height: 210px; overflow: hidden;
    border: 5px solid rgba(255,255,255,.85); border-top: 0; border-radius: 8px 8px 40px 40px;
    clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%); background: rgba(255,255,255,.08);
    box-shadow: inset 0 0 18px rgba(255,255,255,.2);
  }
  .copo .liquido { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--pct) * 1%); background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 60%, #000)); transition: height 700ms cubic-bezier(.3,1.4,.5,1); }
  .copo .liquido::before { content: ""; position: absolute; left: -50%; top: -10px; width: 200%; height: 20px; background: radial-gradient(circle at 10px -2px, transparent 12px, var(--c) 13px) 0 0 / 26px 20px repeat-x; animation: onda 1.4s linear infinite; }
  .copo .bolha { position: absolute; bottom: 4px; width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.7); animation: sobe 2.2s ease-in infinite; }
  .copo .canudo { position: absolute; top: -10px; right: 34px; width: 12px; height: 240px; background: repeating-linear-gradient(180deg, #ff4f8b 0 14px, #fff 14px 28px); border-radius: 6px; transform: rotate(12deg); transform-origin: top; opacity: .9; }
  .copo .icone { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); width: 58px; height: 58px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .copo .icone .emo { font-size: 46px; }
  .copo .valor { margin-top: 8px; font-weight: 900; font-size: 30px; color: var(--c); text-shadow: var(--ov-soft-text-shadow); }

  /* ---------- comemoração ---------- */
  .festa { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .festa h2 {
    margin: 0; font-size: clamp(26px, 11vw, 72px); font-weight: 900; color: #fff; letter-spacing: .02em; white-space: nowrap;
    text-shadow: 0 0 20px var(--c), 0 4px 10px rgba(0,0,0,.8);
    animation: festa 3.4s ease-out forwards;
  }
  .confete { position: fixed; top: 50%; left: 50%; width: 10px; height: 16px; border-radius: 2px; animation: voa 1.8s cubic-bezier(.1,.7,.3,1) forwards; }

  @keyframes pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
  @keyframes listras { to { background-position: 34px 0; } }
  @keyframes onda { to { transform: translateX(26px); } }
  @keyframes sobe { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-190px); opacity: 0; } }
  @keyframes festa { 0% { opacity: 0; transform: scale(.4) rotate(-8deg); } 15% { opacity: 1; transform: scale(1.1) rotate(2deg); } 25% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1); } }
  @keyframes voa { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
</style>
</head>
<body>
<div class="meta escondida" id="meta">
  <div class="txt" id="top-text"></div>

  <div class="modelo presente">
    <div class="icone" data-icone></div>
    <div class="txt bottom" data-bottom></div>
    <div class="barrinha" id="barrinha"><div></div></div>
  </div>

  <div class="modelo barra">
    <div class="icone" data-icone></div>
    <div class="trilho"><div class="fill"></div><div class="valor" data-bottom></div></div>
  </div>

  <div class="modelo circulo">
    <svg viewBox="0 0 120 120"><circle class="fundo" cx="60" cy="60" r="52" pathLength="100"/><circle class="arco" cx="60" cy="60" r="52" pathLength="100"/></svg>
    <div class="dentro"><div class="icone" data-icone></div><div class="valor" data-bottom></div></div>
  </div>

  <div class="modelo numero">
    <div class="icone" data-icone></div>
    <div class="valor" id="numero">0</div>
    <div class="de" data-bottom></div>
  </div>

  <div class="modelo copo">
    <div class="vidro" id="vidro"><div class="liquido"></div><div class="canudo"></div><div class="icone" data-icone></div></div>
    <div class="valor" data-bottom></div>
  </div>

  <span class="selo">✓ META CONCLUÍDA</span>
  <div class="top" id="helper"></div>
</div>
<script type="module">
  import { connectLive, escapeHtml, formatNumber } from '/shared/live-client.js';

  // Link: /overlay/meta/<id>
  // Opções: ?cor=ff4f8b · ?tamanho=150 (ícone/círculo em px) · ?barra=0 (tira a barrinha do modelo presente) · ?tema=neon
  // /overlay/meta/demo?modelo=copo&tipo=likes é a prévia usada no painel (conta sozinha).
  const id = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());
  const params = new URLSearchParams(location.search);
  const $ = (x) => document.getElementById(x);
  const all = (sel) => document.querySelectorAll(sel);
  if (params.get('cor')) document.body.style.setProperty('--c', `#${params.get('cor').replace('#', '')}`);
  if (params.get('barra') === '0') $('barrinha').style.display = 'none';
  if (params.get('tamanho')) {
    const px = Math.min(400, Math.max(40, Number(params.get('tamanho')) || 130));
    document.body.style.setProperty('--tam', `${px}px`);
  }

  const KIND = {
    gift: { emoji: '🎁', label: (g) => g.giftName || 'presentes' },
    likes: { emoji: '❤️', label: () => 'likes' },
    follows: { emoji: '💗', label: () => 'seguidores' },
    shares: { emoji: '🔁', label: () => 'compartilhamentos' },
    coins: { emoji: '🪙', label: () => 'coins' },
  };
  const COR_PADRAO = { gift: '#ffc93c', likes: '#ff4f8b', follows: '#ff7ab8', shares: '#25f4ee', coins: '#ffc93c' };

  let last = null;
  let festaAte = 0;
  let pendente = null;
  let mostrado = 0; // número animado do modelo "numero"

  function preencher(t, g) {
    const k = KIND[g.kind] || KIND.gift;
    return escapeHtml(t)
      .replaceAll('{atual}', formatNumber(g.count))
      .replaceAll('{meta}', formatNumber(g.target))
      .replaceAll('{faltam}', formatNumber(Math.max(0, g.target - g.count)))
      .replaceAll('{porcento}', `${Math.min(100, Math.floor((g.count / g.target) * 100))}%`)
      .replaceAll('{presente}', escapeHtml(k.label(g)))
      .replaceAll('{vezes}', formatNumber(g.times));
  }

  function animarNumero(alvo) {
    const de = mostrado, ini = performance.now(), dur = 600;
    const passo = (t) => {
      const p = Math.min(1, (t - ini) / dur);
      mostrado = Math.round(de + (alvo - de) * (1 - (1 - p) ** 3));
      $('numero').textContent = formatNumber(mostrado);
      if (p < 1) requestAnimationFrame(passo);
    };
    requestAnimationFrame(passo);
  }

  function render(g) {
    // Durante a comemoração, segura a atualização pra mostrar depois.
    if (Date.now() < festaAte) { pendente = g; return; }
    const box = $('meta');
    const hide = !g || !g.enabled || (g.completed && g.onComplete === 'sumir');
    box.classList.toggle('escondida', hide);
    if (!g) return;
    const kind = KIND[g.kind] ? g.kind : 'gift';
    const model = g.model || 'presente';
    box.className = `meta m-${model}${hide ? ' escondida' : ''}${g.completed && g.onComplete === 'manter' ? ' concluida' : ''}`;
    if (!params.get('cor')) document.body.style.setProperty('--c', COR_PADRAO[kind]);
    document.body.style.setProperty('--pct', Math.min(100, (g.count / g.target) * 100).toFixed(2));

    $('top-text').innerHTML = preencher(g.textTop || '', g);
    const bottom = model === 'numero' ? (g.textBottom || '/ {meta}') : (g.textBottom || '{atual}/{meta}');
    all('[data-bottom]').forEach((el) => { el.innerHTML = preencher(bottom, g); });
    if (model === 'numero') animarNumero(g.count);

    const icone = g.giftImage ? `<img src="${escapeHtml(g.giftImage)}" alt="">` : `<span class="emo">${KIND[kind].emoji}</span>`;
    all('[data-icone]').forEach((el) => {
      if (el.dataset.src !== icone) { el.innerHTML = icone; el.dataset.src = icone; }
    });
    $('helper').innerHTML = g.showTop && g.top ? `👑 ${escapeHtml(g.top.nickname)} · ${formatNumber(g.top.count)}` : '';

    if (last && last.count !== g.count) {
      document.querySelectorAll(`.modelo.${model} [data-bottom], .modelo.${model} .valor`).forEach((b) => {
        b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
      });
      if (model === 'copo') bolhas();
    }
    last = g;
  }

  function bolhas() {
    for (let i = 0; i < 6; i++) {
      const b = document.createElement('i');
      b.className = 'bolha';
      b.style.cssText = `left:${15 + Math.random() * 65}%;animation-delay:${i * 120}ms;width:${5 + Math.random() * 7}px;height:${5 + Math.random() * 7}px`;
      $('vidro').appendChild(b);
      setTimeout(() => b.remove(), 2600 + i * 120);
    }
  }

  function festa(g) {
    const DUR = 3400;
    // Mostra a meta cheia durante a festa.
    const cheia = { ...(last || g), ...g, count: g.target, completed: false };
    render(cheia);
    festaAte = Date.now() + DUR;
    const f = document.createElement('div');
    f.className = 'festa';
    f.innerHTML = '<h2>META BATIDA! 🎉</h2>';
    const cores = ['#ffc93c', '#ff4f8b', '#25f4ee', '#9a8cff', '#3ddc84', '#ffffff'];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('i');
      c.className = 'confete';
      const ang = Math.random() * Math.PI * 2, dist = 200 + Math.random() * 500;
      c.style.cssText = `background:${cores[i % cores.length]};--x:${Math.cos(ang) * dist}px;--y:${Math.sin(ang) * dist}px;--r:${Math.random() * 720}deg;animation-delay:${Math.random() * 200}ms`;
      f.appendChild(c);
    }
    document.body.appendChild(f);
    setTimeout(() => {
      f.remove();
      festaAte = 0;
      render(pendente || g);
      pendente = null;
    }, DUR);
  }

  if (id === 'demo') {
    // Prévia do painel: uma meta de mentira que vai enchendo sozinha.
    const target = Math.max(1, Number(params.get('meta')) || 10);
    const g = {
      id: 'demo', enabled: true, kind: params.get('tipo') || 'gift', model: params.get('modelo') || 'presente',
      giftName: params.get('presente') || 'Rosa', giftImage: params.get('imagem') || '',
      target, count: 0, times: 0, completed: false, onComplete: 'recomecar', showTop: true,
      textTop: params.get('topo') ?? '', textBottom: params.get('baixo') ?? '',
      top: { nickname: 'Maria 🌸', count: 3 },
    };
    render(g);
    setInterval(() => {
      g.count += Math.max(1, Math.round(target / 8));
      if (g.count >= target) { g.count = 0; g.times += 1; festa({ ...g, count: target }); setTimeout(() => render(g), 3500); }
      else render(g);
    }, 1100);
  } else {
    const find = (list) => list.find((g) => g.id === id) || null;
    connectLive({
      onHello: ({ goals }) => render(find(goals || [])),
      onGoals: (goals) => render(find(goals)),
      onGoalComplete: (g) => { if (g.id === id) festa(g); },
    });
  }
</script>
</body>
</html>
