<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikSoda · Áudio e vídeo</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  .slot { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  video, img { max-width: 100%; max-height: 100%; object-fit: contain; animation: entra 250ms ease-out; }
  /* vídeo ocupa a tela toda (sem distorcer); use ?ajustar=0 pra manter o tamanho original */
  body.ajustar video { width: 100%; height: 100%; }
  @keyframes entra { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  #ativar {
    display: none; position: fixed; inset: 0; place-items: center; cursor: pointer;
    background: rgba(0,0,0,.55); color: #fff; font: 600 22px "Segoe UI", system-ui, sans-serif; text-align: center;
  }
  #ativar.on { display: grid; }
</style>
</head>
<body>
<div id="ativar">🔊 Clique aqui uma vez para liberar o som<br><small>(só aparece no navegador; no LIVE Studio não precisa)</small></div>
<script type="module">
  import { connectLive } from '/shared/live-client.js';

  // Opções pela URL:
  //   ?fila=0      toca tudo ao mesmo tempo em vez de um depois do outro
  //   ?volume=80   volume geral (multiplica o volume de cada ação)
  //   ?ajustar=0   vídeo no tamanho original em vez de ocupar a tela
  //   ?previa=1    usado pelo painel: sem som, pra não tocar duas vezes
  const params = new URLSearchParams(location.search);
  const FILA = params.get('fila') !== '0';
  const VOLUME = Math.min(100, Math.max(0, Number(params.get('volume') ?? 100))) / 100;
  const PREVIA = params.get('previa') === '1';
  if (params.get('ajustar') !== '0') document.body.classList.add('ajustar');
  const IMAGEM_MS = 5000;
  const MAX_MS = 60000; // nenhuma mídia segura a fila por mais de 1 minuto

  const fila = [];
  let tocando = 0;
  const ativar = document.getElementById('ativar');
  ativar.onclick = () => ativar.classList.remove('on');

  function tocar(p) {
    tocando++;
    const slot = document.createElement('div');
    slot.className = 'slot';
    let el;
    if (p.kind === 'video') { el = document.createElement('video'); el.playsInline = true; }
    else if (p.kind === 'audio') el = document.createElement('audio');
    else el = document.createElement('img');
    el.src = p.url;

    let acabou = false;
    const fim = () => {
      if (acabou) return;
      acabou = true;
      slot.remove();
      tocando--;
      proximo();
    };
    setTimeout(fim, p.kind === 'imagem' ? IMAGEM_MS : MAX_MS);

    if (p.kind !== 'imagem') {
      el.volume = PREVIA ? 0 : (p.volume / 100) * VOLUME;
      el.muted = PREVIA;
      el.onended = fim;
      el.onerror = fim;
      el.play().catch(() => {
        // Navegador comum bloqueia som sem clique: toca mudo e mostra o aviso.
        ativar.classList.add('on');
        el.muted = true;
        el.play().catch(fim);
      });
    } else {
      el.onerror = fim;
    }
    slot.appendChild(el);
    document.body.appendChild(slot);
  }

  function proximo() {
    if (FILA && tocando > 0) return;
    const p = fila.shift();
    if (p) tocar(p);
  }

  // Modo "cortar e repetir": cada presente reinicia a mídia da ação na hora,
  // fora da fila. Combos ficam "picotados" de propósito.
  const cortes = new Map(); // ruleId -> { el, slot, timer }
  const CORTE_INTERVALO_MS = 180;

  function criarCorte(p) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    const el = p.kind === 'video' ? document.createElement('video') : p.kind === 'audio' ? document.createElement('audio') : document.createElement('img');
    if (p.kind === 'video') el.playsInline = true;
    el.src = p.url;
    if (p.kind !== 'imagem') {
      el.volume = PREVIA ? 0 : (p.volume / 100) * VOLUME;
      el.muted = PREVIA;
      el.onended = () => fecharCorte(p.ruleId);
      el.onerror = () => fecharCorte(p.ruleId);
    }
    slot.appendChild(el);
    document.body.appendChild(slot);
    const c = { el, slot, timer: null, kind: p.kind };
    cortes.set(p.ruleId, c);
    return c;
  }

  function fecharCorte(ruleId) {
    const c = cortes.get(ruleId);
    if (!c) return;
    clearTimeout(c.timer);
    c.slot.remove();
    cortes.delete(ruleId);
  }

  function bater(p) {
    const c = cortes.get(p.ruleId) || criarCorte(p);
    clearTimeout(c.timer);
    if (c.kind === 'imagem') {
      c.el.style.animation = 'none'; void c.el.offsetWidth; c.el.style.animation = '';
      c.timer = setTimeout(() => fecharCorte(p.ruleId), IMAGEM_MS);
      return;
    }
    c.el.currentTime = 0;
    c.el.play().catch(() => { ativar.classList.add('on'); c.el.muted = true; c.el.play().catch(() => {}); });
    c.timer = setTimeout(() => fecharCorte(p.ruleId), MAX_MS);
  }

  function cortar(p) {
    const vezes = Math.max(1, Math.min(10, p.times || 1));
    for (let i = 0; i < vezes; i++) setTimeout(() => bater(p), i * CORTE_INTERVALO_MS);
  }

  connectLive({
    onPlay: (p) => {
      if (p.cut) return cortar(p);
      if (fila.length > 50) return; // proteção contra chuva de presentes
      fila.push(p);
      if (FILA) proximo(); else tocar(fila.shift());
    },
  });
</script>
</body>
</html>
