<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikSoda · Ranking</title>
<link rel="stylesheet" href="/shared/temas.css">
<script src="/shared/tema.js"></script>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: var(--ov-font); color: var(--ov-text); padding: 12px; box-sizing: border-box; }
  .box {
    background: var(--ov-bg); border-radius: var(--ov-radius); padding: 14px 14px 10px;
    box-shadow: var(--ov-shadow); border: var(--ov-border-w) solid var(--ov-border);
  }
  .box.sem-fundo { background: transparent; box-shadow: none; padding: 0; }
  h1 {
    margin: 0 0 10px; font-size: 20px; display: flex; align-items: center; gap: 8px;
    text-shadow: var(--ov-text-shadow);
  }
  h1 .icon { font-size: 22px; }
  ol { list-style: none; margin: 0; padding: 0; position: relative; }
  li {
    display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 10px;
    border-radius: calc(var(--ov-radius) * .7); background: var(--ov-item); margin-bottom: 6px;
    transition: transform 400ms ease, background 300ms;
    text-shadow: var(--ov-text-shadow);
  }
  li.flash { background: var(--ov-item-strong); }
  .pos { width: 26px; text-align: center; font-weight: 800; font-size: 17px; flex: none; }
  li:nth-child(1) .pos { color: var(--ov-gold); }
  li:nth-child(2) .pos { color: #d6dbe4; }
  li:nth-child(3) .pos { color: #e3a46f; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none; background: #444 center/cover; display: grid; place-items: center; font-weight: 700; color: #fff; position: relative; }
  /* Coroa no primeiro lugar (?coroa=0 desliga) */
  .coroa li.top1 { height: 56px; background: linear-gradient(90deg, rgba(255, 210, 63, .28), var(--ov-item)); box-shadow: inset 0 0 0 2px rgba(255, 210, 63, .55); }
  .coroa li.top1 .avatar { width: 42px; height: 42px; box-shadow: 0 0 0 2px var(--ov-gold), 0 0 14px rgba(255, 210, 63, .8); }
  .coroa li.top1 .avatar::after { content: "👑"; position: absolute; top: -17px; left: 50%; transform: translateX(-50%) rotate(-12deg); font-size: 20px; text-shadow: none; animation: coroa 1.6s ease-in-out infinite alternate; }
  .coroa li.top1 .name { font-size: 17px; font-weight: 800; }
  .coroa li.top1 .pos { font-size: 0; }
  .coroa li.top1 .pos::before { content: "1"; font-size: 20px; }
  @keyframes coroa { from { transform: translateX(-50%) rotate(-12deg) translateY(0); } to { transform: translateX(-50%) rotate(-4deg) translateY(-2px); } }
  .name { flex: 1; min-width: 0; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .value { font-weight: 800; font-size: 16px; flex: none; color: var(--accent); }
  .vazio { opacity: .75; font-size: 15px; padding: 6px 2px; }
</style>
</head>
<body>
<div class="box" id="box">
  <h1><span class="icon" id="icon"></span><span id="title"></span></h1>
  <ol id="list"></ol>
</div>
<script type="module">
  import { connectLive, escapeHtml, initials, formatNumber } from '/shared/live-client.js';

  // Este arquivo serve aos dois links: /overlay/ranking-likes e /overlay/ranking-coins.
  // Também serve aos rankings mensais: /overlay/ranking-mensal-likes e -coins.
  const kind = location.pathname.includes('coins') ? 'coins' : 'likes';
  const mensal = location.pathname.includes('mensal');
  const DEFAULTS = {
    likes: { title: mensal ? 'Top likes do mês' : 'Top likes', icon: '❤️', accent: '#ff4f8b' },
    coins: { title: mensal ? 'Top presentes do mês' : 'Top presentes', icon: mensal ? '🏆' : '🪙', accent: '#ffc93c' },
  }[kind];

  // Opções pela URL: ?top=5&titulo=Meu%20top&fundo=0
  const params = new URLSearchParams(location.search);
  const TOP = Math.min(20, Number(params.get('top')) || (mensal ? 10 : 5));
  document.getElementById('title').textContent = params.get('titulo') || DEFAULTS.title;
  document.getElementById('icon').textContent = DEFAULTS.icon;
  document.documentElement.style.setProperty('--accent', params.get('cor') ? `#${params.get('cor').replace('#', '')}` : DEFAULTS.accent);
  if (params.get('fundo') === '0') document.getElementById('box').classList.add('sem-fundo');
  if (params.get('coroa') !== '0') document.getElementById('box').classList.add('coroa');

  const list = document.getElementById('list');
  let last = {};

  function render(rankings) {
    const rows = (rankings?.[kind] || []).slice(0, TOP);
    if (!rows.length) {
      list.innerHTML = `<li class="vazio">${kind === 'likes' ? 'Manda like aí! ❤️' : 'Seja o primeiro a mandar presente!'}</li>`;
      last = {};
      return;
    }
    const now = {};
    list.innerHTML = rows.map((r, i) => {
      now[r.username] = r.value;
      const changed = last[r.username] !== undefined && last[r.username] !== r.value;
      const avatar = r.avatar
        ? `<div class="avatar" style="background-image:url('${escapeHtml(r.avatar)}')"></div>`
        : `<div class="avatar">${escapeHtml(initials(r.nickname))}</div>`;
      return `<li class="${changed ? 'flash' : ''} ${i === 0 ? 'top1' : ''}"><span class="pos">${i + 1}</span>${avatar}
        <span class="name">${escapeHtml(r.nickname)}</span><span class="value">${formatNumber(r.value)}</span></li>`;
    }).join('');
    last = now;
    setTimeout(() => list.querySelectorAll('.flash').forEach((el) => el.classList.remove('flash')), 350);
  }

  connectLive(mensal ? {
    onHello: ({ monthly }) => render(monthly),
    onMonthly: render,
  } : {
    onHello: ({ rankings }) => render(rankings),
    onRankings: render,
  });
</script>
</body>
</html>
