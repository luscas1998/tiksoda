<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikSoda · Overlays</title>
<link rel="stylesheet" href="panel.css">
</head>
<body data-page="overlays" data-title="Overlays" data-sub="Um link pra cada coisa que aparece na sua tela">
<script src="shell.js"></script>

<main>
  <section class="card full">
    <h2>Como usar</h2>
    <p class="hint" style="margin-top:0">No TikTok LIVE Studio: <b>Adicionar fonte → Link</b>, cole o link e ajuste o tamanho. Pra mudar opções, edite o link aqui mesmo (ex.: <code>?top=3&amp;fundo=0</code>): a prévia atualiza e o Copiar já leva o link novo. Use os testes da página Início pra ver as prévias em ação.</p>
  </section>
  <div class="full">
    <div class="filters" id="cats"></div>
    <ul id="overlays" class="overlays"></ul>
  </div>
</main>

<script type="module" src="overlays.js"></script>
</body>
</html>
